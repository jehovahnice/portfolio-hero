<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Hero</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Poppins', sans-serif;
}

/* HERO LAYOUT */
.hero {
  display: flex;
  height: 100vh;
}

/* LEFT SIDE */
.left {
  flex: 2;
  background: linear-gradient(135deg, #4b2fc4, #1e90ff);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px;
}

/* RIGHT SIDE */
.right {
  flex: 1;
  background: #c7e87a;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* LOGO */
.logo {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #2bb3f3, #1e90ff);
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 40px;
}

/* TEXT STYLES */
h1 {
  font-size: 22px;
  margin-bottom: 10px;
}

.name {
  font-size: 42px;
  font-weight: 700;
  color: #c7e87a;
}

.title {
  font-size: 28px;
  margin: 15px 0;
}

.title span:first-child {
  color: #ff5c5c;
}

.title span:last-child {
  color: #c7e87a;
}

p {
  max-width: 500px;
  line-height: 1.7;
  margin: 20px 0;
  font-size: 16px;
}

.highlight {
  color: #ff5c5c;
  font-weight: 600;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 14px 30px;
  border-radius: 50px;
  background: linear-gradient(135deg, #2bb3f3, #1e90ff);
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s ease;
  width: fit-content;
}

.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* IMAGE CARD */
/*.card {
  width: 260px;
  height: 300px;
  background: #f5f5f5;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}*/

/* IMAGE */
.card img {
  width: 90%;
  height: auto;
}
.image-box {
  width: 260px;
  height: 260px;
  background: #eee;
  border: 3px solid white;
  position: relative;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* DECORATION */
.image-box::before,
.image-box::after {
  content: "";
  position: absolute;
  border: 2px solid white;
}

.image-box::before {
  width: 100%;
  height: 100%;
  top: 15px;
  left: 15px;
}

.image-box::after {
  width: 100%;
  height: 100%;
  bottom: 15px;
  right: 15px;
}

/* OUTLINE EFFECT */
.card::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border: 2px solid white;
  top: 15px;
  left: 15px;
  border-radius: 20px;
  z-index: -1;
}

/* DOTS DECORATION */
.dots-top,
.dots-bottom {
  position: absolute;
  width: 80px;
  height: 80px;
  background-image: radial-gradient(#333 2px, transparent 2px);
  background-size: 10px 10px;
}

.dots-top {
  top: 20%;
  left: 15%;
}

.dots-bottom {
  bottom: 15%;
  right: 15%;
}
/* BOTTOM NOTE */
.bottom-note {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  
  font-size: 12px;
  letter-spacing: 2px;
  color: #2f2f2f;
  opacity: 0.7;
  text-align: center;
  white-space: nowrap;
}
/* RESPONSIVE */
@media (max-width: 900px) {
  .hero {
    flex-direction: column;
  }

  .left, .right {
    flex: none;
    width: 100%;
    height: auto;
    text-align: center;
  }

  .left {
    padding: 40px 20px;
    align-items: center;
  }

  .right {
    padding: 40px 0;
  }

  p {
    margin: 20px auto;
  }
}
</style>

</head>
<body>

<section class="hero">

  <!-- LEFT -->
  <div class="left">
    
    <div class="logo">&lt;/&gt;</div>

    <h1>Hello 👋 I am,</h1>

    <div class="name">Ivyizigiro Jéhovahnice</div>

    <div class="title">
      <span>A</span> <span>Frontend Developer.</span>
    </div>

    <p>
      Expert en <span class="highlight">HTML5</span>, 
      <span class="highlight">CSS3</span> et 
      <span class="highlight">JavaScript</span>. 
      Basé à Bujumbura, je transforme des idées en interfaces réelles.
    </p>

    <a href="#" class="btn">Contact me</a>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="dots-top"></div>

        <div class="image-box">
            <img src="nice.JPG" alt="Profile">
        </div>

    <div class="dots-bottom"></div>
        <div class="bottom-note">
         HOGI ACADEMY — SCHOOL OF CODE — 2026
        </div>

  </div>

</section>

</body>
</html>
